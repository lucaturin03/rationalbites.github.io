<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog — RationalBites</title>
  <meta name="description" content="Tutti gli articoli del blog: codice, elettronica, domotica.">
  <meta property="og:title" content="Blog — RationalBites">
  <meta property="og:description" content="Tutti gli articoli del blog: codice, elettronica, domotica.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="alternate" type="application/rss+xml" title="RationalBites" href="feed.xml">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>

  <header class="header"></header>

  <main class="contenuto">
    <h2 class="titolo-sezione">Tutti i post</h2>

    <div class="filtri-post">
      <input class="campo-cerca" type="search" placeholder="Cerca nei post…"
             aria-label="Cerca nei post" data-cerca-post>
      <span data-filtro-attivo></span>
    </div>

    <div data-lista-post data-per-pagina="5"></div>

    <nav class="paginazione" data-paginazione></nav>

    <div class="ad-slot" data-ad="blog"></div>
  </main>

  <footer class="footer"></footer>

  <script src="js/include.js"></script>
  <script src="js/lista-post.js"></script>
  <script src="js/ads.js"></script>
</body>
</html>
